# change_orbit block test, match_plane (debug_tools, #444; flown by #446). The runner loads scenario.sfs, spawns
# reference.craft (exec_node's) into a circular 100 km equatorial Kerbin orbit and runs test.ks bundled with the
# Core Library: change_orbit matches Minmus's orbit plane (6 degrees) at the cheaper of its relative nodes, the node
# solved by ADDONS:CLAUDIA:ORBITBURN when the block starts. 2 v sin(3 deg) at 100 km is about 235 m/s.
block = change_orbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: up to half an orbit (about 16 minutes of game time) to the relative node.
timeout_s = 900
check = success == true
check = rel_inc_actual < 0.2
check = burn_ut > 0
check = dv_used > 200
check = dv_used < 280
