# transfer_to block test from the Mun to Minmus (debug_tools, #459): a moon to a moon of the same planet, the cheap in-game
# test of the code a Duna flight uses. The runner loads scenario.sfs, spawns reference.craft (transfer_to's craft) into a
# 30 km circular Mun orbit, runs test.ks bundled with the Core Library, and judges its Script Result against the ranges
# below. transfer_to finds the next Mun-to-Minmus window, ejects, waits out of the Mun's sphere of influence, corrects on
# Kerbin's patch, and ends with the Minmus periapsis set; capture is circularize at pe, not tested here.
block = transfer_to
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to about 1.8 days of game time to the window (the two moons' synodic period), then
# about 3 days of coast with the corrections and their turns.
timeout_s = 1500
check = success == true
# Out of the Mun's sphere of influence: on Kerbin's patch, or inside Minmus's after the finer correction.
check = body != Mun
check = encounter_ut > 0
# Within pe_tolerance (1000 m) of target_pe 30,000 m.
check = target_pe_actual > 29000
check = target_pe_actual < 31000
# From a 30 km Mun orbit the Oberth burn onto a Hohmann-like arc to Minmus is about 250 to 300 m/s (TransferFlightTests).
check = ejection_node_dv > 180
check = ejection_node_dv < 400
check = correction_dv >= 0
check = correction_dv < 30
check = departure_ut > 0
check = arrival_ut > 0
check = v_inf > 0
