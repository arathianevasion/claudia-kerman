# exec_node_short block test (debug_tools, #577): a burn a few percent short is finished, not failed. reference.craft is
# exec_node's, spawned in a 100 km circular orbit. test.ks flies three 120 m/s prograde nodes, each cut short mid-burn
# by a trigger (see test.ks); the result is the first case's, the other two are test_short_* and test_over_*.
# finish_fraction is the default 0.05 (6 m/s of 120), max_residual 1.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: three nodes 5 minutes of game time ahead, each with a turn of up to 180 degrees to trim.
timeout_s = 900
# Each case's trigger cut its node, and the short case's normal went on.
check = test_cuts == 3
check = test_normal_added == true
# Trimmed: about 4 m/s left by the cut, trimmed to within max_residual.
check = success == true
check = finished_short == false
check = residual < 1
check = node_dv > 100
# Short: the 2 m/s normal stays; success with finished_short.
check = test_short_success == true
check = test_short_finished_short == true
check = test_short_residual > 1
check = test_short_residual < 6
# Over the fraction: a failure, as before.
check = test_over_success == false
check = test_over_finished_short == false
check = test_over_residual > 6
