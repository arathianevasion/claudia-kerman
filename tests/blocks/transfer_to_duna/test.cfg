# transfer_to block test to Duna (debug_tools, #459, for #461). The runner loads scenario.sfs (UT 100, a new game),
# spawns reference.craft (transfer_to's craft, about 3,000 m/s) into a 100 km circular Kerbin orbit, runs test.ks bundled
# with the Core Library, and judges its Script Result against the ranges below. transfer_to finds the next Duna window
# (TRANSFERSTEP: Transfer Windows re-solved at fly time), ejects, waits out of Kerbin's sphere of influence, corrects on the
# Sun's patch and halfway, trims the periapsis inside Duna's sphere of influence (#747), and ends with the periapsis set;
# capture is circularize at pe, not tested here.
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
block = transfer_to
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: about 231 days on rails to the window (KSP's rails warp is at most 100,000x, so about
# 3 real minutes once it is up to speed), then about 250 days of coast with three corrections and their turns.
timeout_s = 2400
check = success == true
# Out of Kerbin's sphere of influence: on the Sun's patch, or inside Duna's after the finer correction.
check = body != Kerbin
check = encounter_ut > 0
# Within pe_tolerance (1000 m) of target_pe 50,000 m.
check = target_pe_actual > 49000
check = target_pe_actual < 51000
# The first Duna window of a new game is about day 235 (TransferWindowsTests), at about 1,030 m/s from low Kerbin orbit.
check = departure_ut > 4700000
check = departure_ut < 5300000
check = ejection_node_dv > 980
check = ejection_node_dv < 1110
# #459's acceptance: the heliocentric corrections of an ejection flown to its node stay under 20 m/s.
check = correction_dv >= 0
check = correction_dv < 20
check = arrival_ut > 0
check = v_inf > 0
