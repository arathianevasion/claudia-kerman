# capture block test arriving at Duna with an Ike leg next (debug_tools, #866). The runner loads scenario.sfs (UT 100, a new game, as
# transfer_to_duna), spawns reference.craft (transfer_to's craft, about 3,000 m/s) into a 100 km circular Kerbin orbit and runs test.ks:
# transfer_to Duna at a 60 km periapsis (flight 908b's), capture with the plan below (the Mission Plan's legs from the one in hand on),
# transfer_to Ike from the orbit capture kept, and capture at Ike. capture must keep a high ellipse timed to Ike, not the 60 km circle.
block = capture
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
plan = Transfer to Duna | 1300 | Kerbin to Duna, captured at 60 km.
plan = Transfer to Ike | 200 | From the orbit capture keeps.
plan = Land on Ike | 600 | Capture at Ike and land.
# Real seconds, warp included: transfer_to_duna's 2,400 s, then a wait of up to three loops of the kept ellipse and the trip to Ike.
timeout_s = 3600
check = success == true
check = body == Ike
# capture's kept line starts "kept 60 x ... km for Ike".
check = kept_for_ike == true
check = ecc < 0.011
# From Duna's arrival to low Ike orbit: 1,029 m/s by the circle in 908b, about 458 kept on Core's solver (HighRouteTests).
check = arrival_to_ike_dv > 300
check = arrival_to_ike_dv < 560
