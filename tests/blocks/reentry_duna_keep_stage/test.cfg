# reentry block test, a Duna entry that keeps its stage (debug_tools; #823): see deorbit_kerbin/test.cfg for how it
# runs. reentry_duna_powered's craft and orbit, with reentry's defaults for separate and jettison_stage. The craft has
# no heat shield, so it has no Entry Shield, as a craft keeping its stage for a later entry has none: nothing drops and
# nothing is jettisoned. The plan below stands in for a Mission's, so KSP.log's ENTRYDROP line reads shield number 2. It lands on the LV-T45, which flies down with the tank. max_temp_pct is the figure for the
# Craft Check's hot-entry Warning: note it on #823's checklist (docs/in-game/entry-shield.md).
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
# Craft (#920): the three R8 winglets are off the tank. reentry holds retrograde with the engine and its fins in front, and the tail
# winglets fought that hold (return_target tumbled at 34 km, 132 deg/s). The craft is spawned in orbit, so it needs no fins.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry and the
# braking burn.
timeout_s = 3000
plan = Land on Duna | 100 | Down on the engine, keeping the stage.
plan = Ascend from Duna | 1336 | Burns still planned after this entry.
plan = Return to Kerbin | 623 | The Last Entry.
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 6
check = parts_dropped == 0
check = shield_dropped == false
check = max_temp_pct < 100
