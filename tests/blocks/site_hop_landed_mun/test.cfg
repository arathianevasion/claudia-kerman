# site_hop block test (debug_tools): a Site Hop that starts on the ground, as one really does (#1355). The runner loads
# scenario.sfs, spawns reference.craft (the land test's lander, about 4 km/s of delta-v) landed on the Mun near 2.46, 77.2,
# and runs test.ks bundled with the Core Library. test.ks hops to near 2.46, 81.5, about 15 km east, and land flies the
# powered descent from the hop's suborbital arc.
# #1363: 2.46, 77.2 slopes 24.5 degrees. Before spawning, the runner moves the start, and then the hop target, to the
# nearest ground within 10 km under 5 degrees, keeping the hop within 2 km of 15 km, and logs where each went. test.ks
# reads the moved target as test_hop_target.
block = site_hop
craft = reference.craft
start = landed
landed_body = Mun
landed_lat = 2.46
landed_lng = 77.2
hop_lat = 2.46
hop_lng = 81.5
# Real seconds: a wait on the ground for a daylit touchdown (warped), the burn, a short arc and its descent.
timeout_s = 1200
# It started on the ground, not in orbit.
check = test_start == LANDED
check = success == true
check = situation == LANDED
# land took over on the hop's arc (LANDSTART "arc"), not from an orbit.
check = started_suborbital == true
# 4.3 degrees of longitude at 2.46 degrees north on the Mun's 200 km radius: about 15 km, and the runner keeps the moved
# hop within 2 km of that.
check = hop_km > 12.9
check = hop_km < 17.1
# Down within 5 km of the hop target the runner moved, gently and upright.
check = test_hop_m < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = lean >= 0
check = lean < 15
# Both sites on ground a lander stands on (#1358), read as land reads slope: the runner's search should see to it (#1363).
check = test_start_slope < 5
check = test_site_slope < 5
