# site_hop block test (debug_tools): a Site Hop that starts on the ground, as one really does (#1355). The runner loads
# scenario.sfs, spawns reference.craft (the land test's lander, about 4 km/s of delta-v) landed on the Mun at 1.153, 79.031,
# and runs test.ks bundled with the Core Library. test.ks hops to 1.153, 83.33, about 15 km east, and land flies the
# powered descent from the hop's suborbital arc.
# #1358: the lander toppled at 2.46, 77.2. 1.153, 79.031 is in East Crater, where mission f623's land touched down upright
# (FindLandingSiteMunShotTests); the runner refuses it if it slopes over 5 degrees, and test.ks reports both sites' slopes.
block = site_hop
craft = reference.craft
start = landed
landed_body = Mun
landed_lat = 1.153
landed_lng = 79.031
# Real seconds: a wait on the ground for a daylit touchdown (warped), the burn, a short arc and its descent.
timeout_s = 1200
# It started on the ground, not in orbit.
check = test_start == LANDED
check = success == true
check = situation == LANDED
# land took over on the hop's arc (LANDSTART "arc"), not from an orbit.
check = started_suborbital == true
# 4.3 degrees of longitude at 1.153 degrees north on the Mun's 200 km radius: about 15 km.
check = hop_km > 14
check = hop_km < 16
# Down within 5 km of the site asked for, gently and upright.
check = test_hop_m < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = lean >= 0
check = lean < 15
# Both sites on ground a lander stands on (#1358), read as land reads slope.
check = test_start_slope < 5
check = test_site_slope < 5
