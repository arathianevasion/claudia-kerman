# land block test (debug_tools): a Point of Interest target at Minmus (#713). As land_biome_minmus (the same lander), in a 30 km
# Minmus orbit inclined 25 degrees so its ground track reaches Monolith TMA-8 (23.8 N), landing in the ring 150 m to 1.5 km
# beside the monolith in daylight, never on it.
block = land
craft = reference.craft
orbit_body = Minmus
orbit_altitude = 30000
orbit_inclination = 25
# Real seconds, warp included: up to a turn of Minmus on rails to the pass, then the powered descent.
timeout_s = 2400
check = success == true
check = situation == LANDED
check = sun_up == true
check = distance_to_poi > 140
check = distance_to_poi < 1600
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = reversals == 0
check = lean >= 0
check = lean < 15
check = dv_used > 50
check = dv_used < 400
