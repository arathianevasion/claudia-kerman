# dock block test (debug_tools, #456; flown by #457). The runner loads scenario.sfs, spawns reference.craft (a probe with a
# Clamp-O-Tron Jr on its nose, four RV-105 RCS blocks and a Stratus-V monopropellant tank) into a circular 100 km equatorial
# Kerbin orbit, and a second copy of it, "Block Test Target", 150 m ahead on the same orbit at the same speed (#455's
# relative placement). The runner reads that copy as the Target Vessel while the test runs. The target has a powered kOS
# processor in reach, so the mod runs its dock_hold there (KSP.log: "starting dock_hold" and, at the end, "stopping
# dock_hold" or its report "docked"). dock must line up on the target port's axis, close on RCS and dock.
block = dock
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
target_craft = reference.craft
target_orbit_along = 150
# Real seconds: about 150 m at up to 1 m/s, the last 10 m at 0.3 m/s, and the turns.
timeout_s = 900
check = success == true
check = docked == true
check = test_ports == true
check = monoprop_used > 0
# #706: the dock used to drain the tank translating every tick; with the coast band it should use a modest share.
check = monoprop_used <= 40
