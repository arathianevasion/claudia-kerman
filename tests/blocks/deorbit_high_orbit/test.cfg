# deorbit block test, Kerbin to KSC from a high orbit (#794, debug_tools). The runner spawns reference.craft at the
# 2,000 km apoapsis of an orbit with a 100 km periapsis, equatorial, and runs test.ks bundled with the Core Library:
# deorbit takes the cheapest burn within accuracy_km that max_dv "auto" (the delta-v left less the reserve) allows,
# drops the spent tank and engine (separate 1), and reentry lands the capsule. A burn over max_dv fails the block before
# any burn with its cost and UT in the reason: success false is then the right answer, not a bug (see docs/in-game/deorbit-max-dv.md).
# Compare deorbit_kerbin (80 km circular).
# Craft (#920): STD+S, the Entry Shield layout: probe, kOS, two batteries, SAS and the Mk16 chute, then a 1.25 m heat shield (HeatShield1),
# Decoupler.1, FL-T800 and LV-T45. reentry reads the shield as its Entry Shield (#823) and drops the stack below it 600 s before the air (#815).
# It relies on the shield for an entry of about 3.0 km/s at Kerbin (estimated against stock heat limits).
block = deorbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 2000000
orbit_pe = 100000
orbit_inclination = 0
timeout_s = 3000
check = success == true
check = burn_ut > 0
check = predicted_error_km < 5
check = landed_or_splashed == true
check = miss_km < 25
check = target_km < 50
