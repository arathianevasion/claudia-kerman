# launch part test block test (#1029, debug_tools): launch_hop's craft and climb, with a part test planned on the ascent
# through 3–6 km (part_test stands in for a Mission's chosen PartTest Contract). Core's PARTTEST signals the tick the
# Swivel is in the band; claudia_tick runs its Run Test (or stages it, with no Run Test offered). KSP.log has the
# "PARTTEST launch: ran the test of liquidEngine2.v2" line; the hop flies as before.
block = launch
craft = reference.craft
start = launchpad
timeout_s = 300
part_test = ascent | liquidEngine2.v2 | FLYING | 3000 | 6000
check = success == true
check = coast_ap >= 7900
check = test_max_tilt < 10
