# deorbit block test, Eve (debug_tools): see deorbit_kerbin/test.cfg for how it runs. From a 120 km
# circular equatorial orbit (Eve's air is 90 km deep) deorbit burns for 0 N, 0 E to a 27 km periapsis;
# reentry lands it. Eve's dense air and fast entry stretch the predictor most.
# Craft (#920): STD+S, the Entry Shield layout: probe, kOS, two batteries, SAS and the Mk16 chute, then a 1.25 m heat shield (HeatShield1),
# Decoupler.1, FL-T800 and LV-T45. reentry reads the shield as its Entry Shield (#823) and drops the stack below it 600 s before the air (#815).
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
# It relies on the shield for an entry of about 3.1 km/s at Eve (estimated against stock heat limits).
block = deorbit
craft = reference.craft
orbit_body = Eve
orbit_altitude = 120000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Eve (about 22 h) on rails to the burn, then the entry
# and a slow parachute descent.
timeout_s = 3000
check = success == true
check = burn_ut > 0
check = predicted_error_km < 5
# About 100 m/s from 120 km to a 27 km periapsis.
check = dv_used > 50
check = dv_used < 200
check = landed_or_splashed == true
check = miss_km < 25
check = target_km < 50
