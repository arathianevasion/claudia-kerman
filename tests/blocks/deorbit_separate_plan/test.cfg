# deorbit_separate_plan block test (debug_tools, #835): deorbit's check once the burn is chosen counts who pays for the burn.
# reference.craft is drop_parts_plan's (the launch_orbit craft), in a 100 km circular Kerbin orbit with no stage fired. separate 3 drops
# the first stage and keeps the upper stage: 6.45 t with 4 t of propellant at Isp 320, about 3,038 m/s (test_left). The plan below needs
# 3,000 of it, a margin of 38 that the burn (over 40 m/s) doesn't fit, so a flat subtraction refuses both and the two runs differ only by who pays:
# with the upper engine lit the kept tanks pay and the drop is refused before any node; with it shut down the first stage flies the burn,
# nothing comes off the kept tanks, and the same drop goes. Only the burn and the drop are flown: no descent.
block = deorbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Kerbin (6 h) on rails to the burn.
timeout_s = 1800
plan = Ascend and Return | 3000 | Burns still planned after this one.
check = test_kept_pays_refused == true
check = test_kept_pays_reason_names_burn == true
check = test_kept_pays_no_burn == true
check = test_kept_pays_no_node == true
check = test_dropped_stage_pays_not_refused == true
check = burn_ut > 0
check = test_kept_tanks_untouched == true
