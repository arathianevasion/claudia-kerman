# dock block test against a passive target (debug_tools, #457). Like tests/blocks/dock, but the second craft, "Block Test
# Target", is target.craft: the same craft without its kOS KR-2042, 150 m ahead on the same orbit at the same speed. The
# reference craft is tests/blocks/dock's file: one FL-R10 monopropellant tank of 20 units. With no kOS processor on it
# the mod cannot run dock_hold (KSP.log has no "starting dock_hold" line), so dock meets the target at its port's
# current facing and must still dock the two Clamp-O-Tron Jr ports.
block = dock
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
target_craft = target.craft
target_orbit_along = 150
# Real seconds: about 150 m at up to 1 m/s, the last 10 m at 0.3 m/s, and the turns.
timeout_s = 900
check = success == true
check = docked == true
check = test_ports == true
check = monoprop_used > 0
# #706: the dock used to drain the tank translating every tick; with the coast band it should use a modest share.
# #707: the bound is 11 units of the FL-R10's 20, worked out as in tests/blocks/dock: same craft, same 150 m start, so
# DOCKFUEL needs about 5.3 units and 11 is about twice that. The passive meet's facing is not measured here: Check 3
# of docs/in-game/phase-3-gate.md runs it in game.
check = monoprop_used <= 11
