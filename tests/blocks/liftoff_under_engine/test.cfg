# launch with a decoupler and an Entry Shield still under the lit engine (debug_tools; #945): the launch_hop craft with a TD-12 and a
# HeatShield1 hung under its LV-T45, the engine lit by the test before launch runs, as a powered descent leaves it. launch stages into
# engines (already giving thrust, so no stage fires), then fires the TD-12 nearest the engine and lets it and the shield go before the
# throttle comes up, then hops to 8 km as launch_hop does.
# Craft: hand-built from launch_hop's by an agent that did not open the VAB (the two parts under the engine sit by their nodes, not
# measured); open it in the VAB once and re-save it if it loads with the parts misplaced.
block = launch
craft = reference.craft
start = launchpad
timeout_s = 300
check = success == true
# The shield under the engine was gone by the time the throttle first rose, and is gone at the end.
check = test_cleared_before_climb == true
check = test_shield_left == 0
check = test_top_alt > 6000
check = coast_ap >= 7900
