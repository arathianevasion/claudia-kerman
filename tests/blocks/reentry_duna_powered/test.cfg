# reentry block test, Duna powered touchdown (debug_tools; #628): see deorbit_kerbin/test.cfg for how it runs. The
# deorbit_duna craft (probe, Mk16 chute, TD-12, FL-T800, LV-T45) from an 80 km circular equatorial orbit: deorbit
# burns for 0 N, 0 E to a 15 km periapsis keeping the tank and engine, then reentry flies the fall with chutes "none"
# and, with an engine aboard, decides for itself (#824) to brake on the LV-T45 by radar altitude.
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
# Craft (#920): the three R8 winglets are off the tank. reentry holds retrograde with the engine and its fins in front, and the tail
# winglets fought that hold (return_target tumbled at 34 km, 132 deg/s). The craft is spawned in orbit, so it needs no fins.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry and the
# braking burn.
timeout_s = 3000
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 6
check = powered_dv > 20
# The chute is never armed.
check = chutes_opened == 0
check = chute_stowed == true
