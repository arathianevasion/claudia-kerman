# change_orbit block test, set_inc (debug_tools, #444; flown by #446). The runner loads scenario.sfs, spawns
# reference.craft into a circular 100 km equatorial Kerbin orbit and runs test.ks bundled with the Core Library:
# change_orbit turns the orbit to 90 degrees, the node solved by ADDONS:CLAUDIA:ORBITBURN when the block starts.
# reference.craft is exec_node_long's (two FL-T800 + LV-T45 stages, the first tank drained to 45%): about 585 +
# 3000 m/s against the 2 v sin(45 deg) = 3176 m/s at 100 km (v 2246 m/s). The burn is "in 300" s rather than the
# default apoapsis: on a circle the craft can sit at its apsis, which #443's solve can miss.
block = change_orbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: 5 minutes to the burn and a burn of about 2 minutes.
timeout_s = 900
check = success == true
check = inc_actual > 89.5
check = inc_actual < 90.5
check = burn_ut > 0
# Within 5% of 2 v sin(45 deg) at 100 km: 3017 to 3335 m/s.
check = dv_used > 3017
check = dv_used < 3335
