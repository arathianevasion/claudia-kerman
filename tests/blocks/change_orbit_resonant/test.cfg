# change_orbit block test, resonant (debug_tools, #444; flown by #446). The runner loads scenario.sfs, spawns
# reference.craft (exec_node's) into a circular 100 km equatorial Kerbin orbit and runs test.ks bundled with the
# Core Library: change_orbit makes a 2:3 resonant orbit (2 orbits while the 100 km orbit makes 3, so 1.5 times its
# period), the node solved by ADDONS:CLAUDIA:ORBITBURN when the block starts. A prograde burn of about 252 m/s
# lifts the apoapsis to about 534 km. test.ks records the period before the burn as test_period_before and the
# ratio as test_period_ratio. The burn is "in 300" s rather than the default periapsis: on a circle the craft can
# sit at its periapsis, which #443's solve can miss.
block = change_orbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: 5 minutes to the burn.
timeout_s = 600
check = success == true
check = test_period_ratio > 1.485
check = test_period_ratio < 1.515
check = burn_ut > 0
check = dv_used > 230
check = dv_used < 280
