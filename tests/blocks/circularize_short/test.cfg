# circularize_short block test (debug_tools, #577): a circularization a few percent short is finished, not failed.
# reference.craft is exec_node's, spawned in a 100 km circular orbit. test.ks raises the apoapsis and circularizes there
# three times, each burn cut short mid-burn by a trigger (see test.ks); the result is the trimmed case's, the other two
# are test_short_* and test_over_*. finish_fraction and tolerance are the defaults (0.05, 0.01).
block = circularize
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: three raises and three coasts of half an orbit to the apoapsis.
timeout_s = 1800
# Each case's trigger cut its main burn, and the short case's trim was cut too.
check = test_cuts == 4
# Trimmed: the trim brought the orbit within tolerance.
check = success == true
check = finished_short == false
check = ecc < 0.01
check = dv_used > 70
# Short: still over tolerance after the cut trim, within the fraction: success with finished_short.
check = test_short_success == true
check = test_short_finished_short == true
check = test_short_ecc > 0.01
check = test_short_ecc < 0.05
# Over the fraction: a failure, as before.
check = test_over_success == false
check = test_over_finished_short == false
check = test_over_ecc > 0.01
