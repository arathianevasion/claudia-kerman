# science with two copies of one experiment (debug_tools; #1297), Sandbox. The science test's probe with a second 2HOT thermometer,
# in a 100 km circular Kerbin orbit. temperatureScan is named, so each call wants a reading. Call 1 and call 2 ("keep") each run one
# thermometer, a free one first, and keep the data. Call 3 ("keep") finds no free part and fails, saying so. Call 4 ("auto", link up)
# transmits one thermometer's held data to free it, then runs it and keeps the new reading.
# Craft: the science test's, with the second thermometer placed by hand without the VAB; re-save it in the VAB if it loads misplaced.
block = science
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 300
check = success == true
check = ran_first == 1
check = ran_second == 1
check = kept_two == true
check = third_success == false
check = third_no_free_part == true
check = fourth_success == true
check = fourth_freed == 1
