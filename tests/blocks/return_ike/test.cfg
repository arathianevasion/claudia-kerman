# return block test from Ike (debug_tools), for #450 and the #452 gate. The runner loads scenario.sfs,
# spawns reference.craft into a circular Ike orbit, runs test.ks bundled with the Core Library, and
# judges its Script Result against the contract ranges below. return aims for a 35 km Duna periapsis
# (Duna's air is 50 km deep) with a mid-course correction, ending before reentry: the same block as the
# Mun's return, with no body named in it.
block = return
craft = reference.craft
orbit_body = Ike
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit's wait to eject (about 50 minutes of game time), the climb
# out of Ike's sphere of influence, then about 2 h of game time to the correction halfway home.
timeout_s = 1200
check = success == true
# Out of Ike's sphere of influence (the correction waits for that) and not yet down.
check = body == Duna
check = planet_pe > 25000
check = planet_pe < 45000
check = reentry_ut > 0
check = correction_dv >= 0
# The solver's Ike ejection is about 120 m/s from 30 km (ReturnBurnTests); the correction adds a little.
check = dv_used > 80
check = dv_used < 300
