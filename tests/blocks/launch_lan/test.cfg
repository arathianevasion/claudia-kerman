# launch into a plane block test (debug_tools, #464): the craft starts on Kerbin's launch pad; launch waits for the pad to
# pass under Minmus's plane (launch_at "Minmus", the C# LAUNCHWINDOW) and flies to an 80 km apoapsis.
# Spec: the orbit's LAN ends within 1 degree of Minmus's. The wait is up to a Kerbin day, warped on the pad.
# Craft (#920): the stabilizer above the probe core is an advSasModule (1.25 m Advanced Inline Stabilizer, 15 kN*m, 0.1 t), not the 0.625 m
# sasModule (5 kN*m): the two-stage craft lost control at 9-13 km just after the first stage separated. The upper stage has no fins by design. Same
# place and staging; the figures are from GameData/Squad/Parts, the cause is an estimate until the player flies it.
block = launch
craft = reference.craft
start = launchpad
# Real seconds: the warp to the window (up to a day of game time), then about 4 minutes of ascent and coast.
timeout_s = 1500
check = success == true
check = ap_error > -2000
check = ap_error < 2000
check = lan_actual > 0
check = test_lan_error < 1
