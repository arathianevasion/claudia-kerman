# land block test (debug_tools) with far more thrust than it needs, on Ike (#865). The runner loads scenario.sfs, spawns
# reference.craft (the land test lander with its tank 70% full: about 4.2 t on 60 kN, so 13:1 at Ike to start and 15:1 by
# touchdown, as m20261107-055424-908b was) into a 30 km equatorial Ike orbit, runs test.ks bundled with the Core Library, and
# judges its Script Result against the contract ranges below. 908b touched down 43 degrees off at 21 deg/s and tipped to 70.
block = land
craft = reference.craft
orbit_body = Ike
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit's wait on rails (about 50 minutes of game time), then the powered descent.
timeout_s = 1800
check = success == true
check = situation == LANDED
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = touchdown_h_speed >= 0
check = touchdown_h_speed < 0.5
# #865's pass: a final lean under 10 degrees (the slope included). The touchdown attitude (no more than 5 degrees off and
# 2 deg/s) is in KSP.log's phase touchdown trace line (error, rate): docs/in-game/land.md.
check = lean >= 0
check = lean < 10
# Seconds it held height to settle below 10 m: 0 if it came down settled, never over the hold's 10 s.
check = settle_s >= 0
check = settle_s <= 10
# From 30 km round Ike (340 m/s), a deorbit, a correction and braking about 400 m/s across the ground: about 500 m/s.
check = dv_used > 250
check = dv_used < 900
