# land block test (debug_tools) with far more thrust than it needs, on the Mun (#865). The runner loads scenario.sfs, spawns
# reference.craft (the land test lander with its tank 70% full: about 4.2 t on 60 kN, so 9:1 at the Mun to start and 10:1 by
# touchdown, the same craft as tests/blocks/land_high_twr_ike) into a 30 km equatorial Mun orbit, runs test.ks bundled with the Core Library, and
# judges its Script Result against the contract ranges below: the Mun landing still lands clean (tests/blocks/land's ranges).
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit's wait on rails, then a few minutes of powered descent.
timeout_s = 1500
check = success == true
check = situation == LANDED
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = touchdown_h_speed >= 0
check = touchdown_h_speed < 0.5
# #865's pass: a final lean under 10 degrees (the slope included). The touchdown attitude (no more than 5 degrees off and
# 2 deg/s) is in KSP.log's phase touchdown trace line (error, rate): docs/in-game/land.md.
check = lean >= 0
check = lean < 10
# Seconds it held height to settle below 10 m: 0 if it came down settled, never over the hold's 10 s.
check = settle_s >= 0
check = settle_s <= 10
# As tests/blocks/land: about 730 m/s from 30 km round the Mun; 900 leaves 20% for steering losses and real terrain.
check = dv_used > 400
check = dv_used < 900
