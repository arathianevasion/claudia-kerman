# reentry block test, chutes first, engines last (debug_tools; #954): see deorbit_kerbin/test.cfg for how it runs. reentry_duna_powered's craft (probe, Mk16 chute, TD-12, FL-T800, LV-T45,
# which has a gimbal) and orbit. Torque source: the small inline reaction wheel (sasModule) and the probe core. Flown with reentry's defaults, so the Chute Group ("auto") holds the Mk16;
# the tank kept keeps it heavy, so the prediction is over 10 m/s and reentry lands on the engine (a powered finish with chutes).
# Flight m20261109-140705-ae3a is what this is for: braking at 1.7 km under chutes still opening tumbled the lander. Here the engine stays off until the blocknotes show the chute fully open.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry and the
# braking burn.
timeout_s = 3000
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 6
check = powered_dv > 5
check = powered_dv < 120
check = chutes_opened >= 1
check = gimbal_locked == false
