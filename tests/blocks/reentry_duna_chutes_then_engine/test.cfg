# reentry block test, chutes then engine, from an orbit: the last-resort test (debug_tools; #954): see deorbit_kerbin/test.cfg for how it runs. reentry_duna_powered's craft (probe, Mk16 chute, TD-12, FL-T800, LV-T45,
# which has a gimbal) and orbit. Torque source: the small inline reaction wheel (sasModule) and the probe core. Flown with reentry's defaults, so the Chute Group ("auto") holds the Mk16;
# the tank kept keeps it heavy, so the prediction is over 10 m/s and reentry lands on the engine (a powered finish with chutes).
# Flight m20261109-140705-ae3a is what this is for: braking at 1.7 km under chutes still opening tumbled the lander. Here the engine stays off until the blocknotes show the chute fully open.
# From an orbit this slick, heavy craft is still at about 650 m/s at 1,500 m AGL (flight on 211d22f5, 2026-11-09: 655 m/s at 1,459 m), so the Mk16 stays armed (it opens under 250 m/s),
# counts as failed and the last resort burns, then the chute opens and the spin rule may cut the relit engine. This test is that path; the chutes-first path is reentry_duna_hop_chutes_then_engine.
# The harness checks Script Result fields only, so it cannot see the blocknotes: powered_dv > 5 is the proxy for the last resort (nothing else burns the engine here), and the spin rule is not
# checked here at all, only in docs/in-game/reentry-chutes-then-engine.md (trace lines `zero_why spinning`). The player's run: touchdown 1.7 m/s, powered_dv 299.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry and the
# braking burn.
timeout_s = 3000
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 3
check = powered_dv > 5
check = chutes_opened >= 1
check = gimbal_locked == false
