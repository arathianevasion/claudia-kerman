# transfer_to block test home from Duna, with the landing at KSC (#918, debug_tools), then reentry. The runner loads scenario.sfs,
# spawns reference.craft (a heat shield, chutes and about 3,000 m/s) into a 100 km circular Duna orbit, runs test.ks bundled with the
# Core Library, and judges its Script Result below. The Mission names no place, so the trip aims at KSC by default (#880).
# transfer_to waits for the window, ejects, corrects on the Sun's patch (target_pe only, #747), and inside Kerbin's sphere of influence
# flies the correction aimed at KSC (#915); reentry then flies #880's Late Trim before the drop.
#
# scenario.sfs UT: 1,700,000, found with Core's own window solver (TransferWindows.Find, as plan_transfer uses it) on the stock body table
# with the craft in a 100 km circular Duna orbit, target Kerbin, target_pe 80,000, capture false (a trip home ends in reentry, #758):
# searched from UT 1,700,000 the soonest window departs at UT 1,744,633 (about 2.1 Kerbin days on, 663 m/s); the optimal one is UT
# 3,325,344 (577 m/s). The wait for the ejection point inside the orbit comes on top.
#
# Logged, not judged: the aim's distance from KSC and delta-v are in KSP.log (`block call TRANSFERSTEP`, "landing aim: <km> km from the
# target, periapsis <km> km, <m/s> m/s"), the Late Trim's decision in the `block call ENTRYTRIM` line (a burn, or "no trim: <reason>"),
# and target_km, the craft's distance from KSC, in the Script Result. Accuracy is not judged here: #915 and #880 say how close they aim.
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
block = transfer_to
craft = reference.craft
orbit_body = Duna
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included, an estimate to be set from a timed run (#918): the rails warp to the window, about 2 days, then about 8 months
# of coast with its corrections and their turns (the Duna run's 250 days took about 2 minutes plus turns), then reentry's wait for the
# atmosphere and a slow parachute descent. Sized from the return_target and transfer_to_duna budgets, not yet measured.
timeout_s = 3600
check = success == true
check = body == Kerbin
check = landed_or_splashed == true
# #994: reentry starts on the arrival's hyperbolic path above the air and enters directly, with no capture.
check = reentry_success == true
# Within pe_tolerance (1000 m) of target_pe 30,000 m: the arrival's periapsis, held by the finer trim after the aimed correction.
check = target_pe_actual > 29000
check = target_pe_actual < 31000
