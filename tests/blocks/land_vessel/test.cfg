# land block test (debug_tools): beside a landed Target Vessel on the Mun (#662). The runner loads scenario.sfs, spawns
# reference.craft (the land test's lander) into a 30 km equatorial Mun orbit, and lands target.craft (a second copy of it),
# "Block Test Target", on the equator 270 degrees of longitude east of the point under the craft, reading it as the Target
# Vessel while the test runs. land's target "vessel" aims 200 m (vessel_offset) north of it, across the ground track, and must
# come to rest within a few hundred metres of it without touching it.
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
target_craft = target.craft
target_landed_lat = 0
target_landed_ahead = 270
# Real seconds, warp included: up to an orbit's wait on rails, then a few minutes of powered descent (as the land test).
timeout_s = 1500
check = success == true
check = situation == LANDED
# The target started landed and land succeeded: the snapshot's target entry carried its place, read through TARGETVESSEL.
check = test_read_target == true
# Within a few hundred metres of the vessel, and never on top of it: 50 m is land's least clearance after a divert.
check = test_vessel_m > 50
check = test_vessel_m < 700
# Still standing where it was landed: the craft didn't touch it.
check = test_target_moved_m < 5
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = reversals == 0
check = lean >= 0
check = lean < 15
# The same orbit and descent as the land test (see its test.cfg for the figures).
check = dv_used > 400
check = dv_used < 900
