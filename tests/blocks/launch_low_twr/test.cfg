# launch burn-through block test (debug_tools, #932): the craft starts on Kerbin's launch pad with an upper stage on 3% thrust (6.5 kN
# on about 3.5 t), too weak to coast to an 80 km apoapsis and circularize there. launch keeps burning prograde past target_ap until the
# periapsis clears the atmosphere (one KSP.log line, "block call BURNTHROUGH", has the figures), then circularize trims at apoapsis.
# Craft: launch_orbit's with a second full LV-T45 stage under it. The figures (liftoff TWR about 1.1, about 2400 m/s on the two lower
# stages) are estimates from GameData/Squad/Parts until the player flies it.
block = launch
craft = reference.craft
start = launchpad
# Real seconds: about 3 minutes to the cutoff, then a burn of up to about 8 minutes and the circularize.
timeout_s = 1500
check = success == true
check = launch_success == true
# The burn went on past target_ap: the apoapsis overshoots by more than launch's usual 2 km.
check = launch_ap_error > 2000
check = orbit.pe > 70000
check = situation == ORBITING
