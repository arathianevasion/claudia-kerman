# capture block test (debug_tools, #788). The runner loads scenario.sfs, spawns reference.craft into a circular Kerbin
# orbit and runs test.ks: transfer_to with plane 90 aims for a polar Mun arrival, and capture reads the recorded plane.
block = capture
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: the transfer's window and about 6 h of game time to the Mun, then the capture.
timeout_s = 1800
check = success == true
check = body == Mun
# Circular at the periapsis it arrived at, in the plane: within half a degree of polar.
check = ecc < 0.011
check = inc > 89.5
check = inc < 90.5
check = plane_leftover_deg < 0.5
# The capture burn from the approach at the Mun is about 300 m/s.
check = capture_dv > 200
check = capture_dv < 500
