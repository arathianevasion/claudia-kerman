# deorbit block test, Duna (debug_tools): see deorbit_kerbin/test.cfg for how it runs. From an 80 km
# circular equatorial orbit (Duna's air is 50 km deep) deorbit burns for 0 N, 0 E to a 15 km
# periapsis; reentry lands it. The thin air leaves the craft fast near the ground, so the target's
# terrain height is where the prediction ends.
# Craft (#920): three OX-STAT static solar panels (0.35 EC/s each at best, an estimate) on the kOS part, above the decoupler, for the long wait
# (about 54,000 s or more, estimated); no winglets; and a second Mk16 radially on the kOS part, in stage 0 with the first. The pod alone is
# estimated at about 12 m/s on one Mk16 at Duna, over the 10 m/s decision speed; two bring it under (an estimate, not measured).
block = deorbit
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry
# and the parachute descent.
timeout_s = 3000
check = success == true
check = burn_ut > 0
check = predicted_error_km < 5
# About 40 m/s from 80 km to a 15 km periapsis.
check = dv_used > 15
check = dv_used < 100
check = landed_or_splashed == true
check = miss_km < 25
check = target_km < 50
