# reentry block test, a Duna entry with its batteries nearly empty (debug_tools; #942): see deorbit_kerbin/test.cfg for how it runs. The craft is
# reentry_duna_powered's, its batteries at 26 of 2010 units (1.3%, so under both min_ec_pct's default and the 2% that arms the chutes); its panels
# keep the kOS part alive. It starts at the 80 km apoapsis of a 15 km periapsis orbit, so no burn or long wait drains it or lets the panels refill it
# before reentry starts. With the periapsis in the air min_ec_pct doesn't end the block: it releases the steering at once and arms the stowed chute.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_pe = 15000
orbit_inclination = 0
# Real seconds: half an orbit of warp, the entry, then the fall.
timeout_s = 3000
check = aborted_on_charge == false
check = chutes_used_count >= 1
check = landed_or_splashed == true
