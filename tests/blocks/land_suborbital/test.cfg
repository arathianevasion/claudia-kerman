# land block test (debug_tools): a start from a suborbital arc (#1309). The runner loads scenario.sfs, spawns
# reference.craft (a small lander) into a 30 km equatorial Mun orbit, runs test.ks bundled with the Core
# Library, and judges its Script Result against the contract ranges below. test.ks burns onto an arc that
# meets the ground about a quarter of the way round; land aims where it meets the ground ("any").
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds: a minute to the burn, a few minutes' fall and a few minutes of powered descent.
timeout_s = 1200
check = success == true
check = situation == LANDED
# The burn flew and land began on the arc (SUB_ORBITAL), where it used to refuse.
check = started_suborbital == true
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = lean >= 0
check = lean < 15
# No deorbit burn: the powered descent cancels about 555 m/s at the ground (vis-viva on the arc) and holds the craft
# up; the land test's 900 less its 17 m/s deorbit and few m/s of correction leaves 880.
check = dv_used > 400
check = dv_used < 880
