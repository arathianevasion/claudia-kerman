# reentry block test, chutes first, engines last, as a hop (debug_tools; #954 follow-up): see deorbit_kerbin/test.cfg for how it runs. reentry_duna_powered's craft (probe, Mk16 chute, TD-12, FL-T800, LV-T45,
# which has a gimbal), the Mk16's deployAltitude set to 3000 m, and a hop instead of its orbit (below). Torque source: the small inline reaction wheel (sasModule) and the probe core. Flown with reentry's defaults, so the Chute Group ("auto") holds the Mk16;
# the tank kept keeps it heavy, so the prediction is over 10 m/s and reentry lands on the engine (a powered finish with chutes).
# Start (#954 follow-up): the first version came in from an 80 km orbit and was at 655 m/s at 1,459 m AGL (flight on 211d22f5, 2026-11-09), so the Mk16 never left
# `armed` (it opens under 250 m/s) and the last resort burned. This craft is slick and heavy: it falls at about its terminal speed, so a steeper or lower orbit
# cannot slow it by 1,500 m, and a drogue would stay armed too (it opens under 500 m/s). So it is a suborbital hop on Duna: a near-vertical fall (a periapsis 1 km from
# the centre, 75 m/s sideways at the top) from 8 km. Drag only slows it, so free fall bounds the speed at 1,500 m AGL: sqrt(75^2 + 2 * 2.94 * (8000 - 1500)) = 209 m/s
# at most, with the ground at sea level or above (Duna's GM 3.0136e11 m3/s2, radius 320 km). The repo's Duna air model has 0.04 atm at about 2.9 km above sea level (2.0 to 3.6 km over 4 to 7 km scale heights: EntryDropLeadTests, stowed-for-entry.md), so the Mk16 is not out much above 3 km and, with deployAltitude 3,000, is full from about there on a ground near sea level.
# The harness has no longitude key, so the hop lands wherever 'orbit_altitude 8000, orbit_pe -319000, inclination 0' puts it, which is not known here. test.ks reads the ground height under the craft at the start and the check ground_ok == true fails (the printed line and the ground_m field carry the height) if the ground is above about 1 km (a high spawn would make this a second last-resort test).
# NOT shown without flying: that powered_dv stays under 120, and that the chute is full-open and settled before the last-resort height.
# Flight m20261109-140705-ae3a is what this is for: braking at 1.7 km under chutes still opening tumbled the lander. Here the engine stays off until the blocknotes show the chute fully open.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 8000
orbit_pe = -319000
orbit_inclination = 0
# Real seconds: about a minute of fall, then the chute descent and the braking burn.
timeout_s = 900
check = ground_ok == true
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 6
check = powered_dv > 5
check = powered_dv < 120
check = chutes_opened >= 1
check = gimbal_locked == false
