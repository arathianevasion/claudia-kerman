# reentry block test, a weak engine above a strong one (debug_tools; #842): see deorbit_kerbin/test.cfg for how it runs.
# reentry_duna_powered's craft with a 2 kN LV-1R Spider in stage 3, above the LV-T45 in stage 2, from the same 80 km circular
# equatorial orbit. The Spider can't stop the fall at Duna, so reentry (#824, #842) must choose stage 2 and brake on the LV-T45
# by radar altitude; KSP.log's ENTRYFINISH line names stage 2 and why.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry and the
# braking burn.
timeout_s = 3000
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 6
check = powered_dv > 20
# The chute is never armed.
check = chutes_opened == 0
check = chute_stowed == true
