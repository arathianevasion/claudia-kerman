# drop_empty block test (debug_tools): the common drop_empty option of issue #279, flown by launch from
# Kerbin's pad. reference.craft is the launch_orbit craft with the name tag "spent" on its first-stage
# tank (a KOSNameTag module, since the stock craft carry no tags). The shared auto-staging must fire that
# tank's decoupler once it is empty and never earlier; the second stage's tank, which is untagged, must
# stay on. stage_limit 2 keeps the probe's decoupler and chute. The tank is a serial stage, not a radial
# one, so this checks the empty-then-drop rule and the result, not a drop that beats flameout.
# Craft (#920): the stabilizer above the probe core is an advSasModule (1.25 m Advanced Inline Stabilizer, 15 kN*m, 0.1 t), not the 0.625 m
# sasModule (5 kN*m): the two-stage craft lost control at 9-13 km just after the first stage separated. The upper stage has no fins by design. Same
# place and staging; the figures are from GameData/Squad/Parts, the cause is an estimate until the player flies it.
block = launch
craft = reference.craft
start = launchpad
timeout_s = 600
check = success == true
check = test_dropped_count > 0
# The tagged tank was empty when it went (LiquidFuel + Oxidizer units left at the last sample before).
check = test_fuel_at_drop >= 0
check = test_fuel_at_drop < 5
check = test_tagged_left == 0
# The decoupler took the first stage (tank, engine, three winglets: 5 parts) and nothing else: the craft
# is 15 parts, so 6 or more gone means the probe stack or second stage went too.
check = test_parts_lost > 0
check = test_parts_lost < 6
