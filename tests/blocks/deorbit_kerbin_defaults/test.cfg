# deorbit block test, Kerbin to KSC with defaults (#666): deorbit(lexicon("target", "ksc")) then reentry(), no
# options, as Haiku flew in Mission efe0. deorbit's separate is "none" so it aims for the whole stack; reentry's
# "auto" then drops the tank and engine below the heat shield, and the lighter capsule lands short of KSC (about
# 238 km in the flight). StackDropLint warns about this pairing. The checks below record today's miss rather
# than asserting accuracy: they pass while the miss stays large. When deorbit and reentry agree on the craft,
# tighten miss_km and target_km to deorbit_kerbin's. Compare deorbit_kerbin (separate 1). The craft has a heat
# shield (HeatShield1) between the batteries and the Decoupler.1 stack.
block = deorbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 80000
orbit_inclination = 0
timeout_s = 2400
check = success == true
check = burn_ut > 0
check = landed_or_splashed == true
check = parts_dropped > 0
# Today's miss, not accuracy: about 238 km from KSC in efe0.
check = target_km > 50
