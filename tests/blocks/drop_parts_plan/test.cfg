# drop_parts_plan block test (debug_tools, #825): drop_parts_plan refuses a drop that takes delta-v the Mission Plan still needs.
# reference.craft is drop_parts' (the launch_orbit craft, its first-stage tank tagged "spent"), in a 100 km circular Kerbin orbit
# with no stage fired. A block test has no Mission, so the plan below stands in for one: a burn the craft cannot fly is still to come.
# drop_parts of the fuelled first stage must fail before firing, with the figures, and with allow_no_engine true as well; the craft
# stays whole. A part that takes no delta-v with it is not checked (there is none here, so only the refusal is flown).
block = drop_parts
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 120
plan = Ascend and Return | 99999 | Burns still planned after this one.
check = test_refused == true
check = test_reason_names_plan == true
check = test_refused_nothing_dropped == true
check = test_override_refused == true
check = test_override_nothing_dropped == true
check = test_tagged_left > 0
