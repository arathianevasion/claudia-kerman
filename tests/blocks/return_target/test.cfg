# return block test with a landing target (debug_tools), from the Mun to KSC. The runner loads
# scenario.sfs, spawns reference.craft into a circular Mun orbit, runs test.ks bundled with the Core
# Library, and judges its Script Result against the contract ranges below. return ejects, then its
# ejection picks the window and times its burn for KSC (#792) and its mid-course correction trims the rest; reentry then brings the craft down.
# Logs predicted against actual: miss_km is return's predicted_geo against where it came down, target_km
# the whole flight's distance from KSC. The accuracy is logged, not judged: the spec has return report
# predicted_error_km so Claudia can plan a Kerbin capture plus deorbit when it is too far out.
# Craft (#920): STD+S, the Entry Shield layout: probe, kOS, two batteries, SAS and the Mk16 chute, then a 1.25 m heat shield (HeatShield1),
# Decoupler.1, FL-T800 and LV-T45. reentry reads the shield as its Entry Shield (#823) and drops the stack below it 600 s before the air (#815).
# It relies on the capsule (pod, kOS, batteries, SAS, chute, shield: about 1.5 t, an estimate) landing under the Mk16 once the stack is gone, and on the
# stack's delta-v (FL-T800 and LV-T45, about 1.5 km/s, an estimate) for the return. The winglets stay on the dropped stack.
# The checks below: shield_dropped and parts_dropped (the shield, the decoupler, the tank and the engine went: at least 3), and landed_or_splashed.
block = return
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: as the return test (up to 7.1 h on rails to the window, the climb out of the Mun's
# sphere of influence, about 4 h to the correction), then
# the wait for the atmosphere and a slow parachute descent.
timeout_s = 3000
check = success == true
check = body == Kerbin
# A prediction was made (-1 is none).
check = predicted_error_km > -1
check = planet_pe > 20000
check = planet_pe < 70000
check = reentry_ut > 0
check = shield_dropped == true
check = parts_dropped >= 3
check = landed_or_splashed == true
check = correction_dv >= 0
# The aim's cost over the window's least burn (#792).
check = aim_dv < 3
