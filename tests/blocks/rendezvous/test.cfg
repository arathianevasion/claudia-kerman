# rendezvous block test (debug_tools, #455; flown by #457, and the start #456's dock tests reuse). The runner loads
# scenario.sfs, spawns reference.craft (exec_node's) into a circular 100 km equatorial Kerbin orbit, and a second copy of
# it, "Block Test Target", 200 km behind it on the same track moving 30 m/s faster and 6 m/s off its plane (about
# 0.15 degrees: an orbit about 100 by 139 km). The runner reads that copy as the Target Vessel while the test runs.
# rendezvous must fly all five steps (match_plane, phasing: the transfer window is about 24 orbits off, transfer,
# correction, match_velocities) and end with the target loaded and under 2 m/s relative. About 150 m/s in all.
block = rendezvous
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
target_craft = reference.craft
target_orbit_along = -200000
target_orbit_prograde = 30
target_orbit_normal = 6
# Real seconds, warp included: about seven orbits of game time on rails between the burns.
timeout_s = 2400
check = success == true
check = distance_actual < 2250
check = relative_speed_actual < 2
check = test_steps == 5
