# reentry block test, a Duna entry whose Chute Group is too weak and no engine (debug_tools; #827): see deorbit_kerbin/test.cfg for how it
# runs. The craft is reentry_duna_powered's without its engine and winglets, its tank about a sixth full (about 1.7 t), with a Mk16 in stage 2
# on the kOS part and the Mk16 in stage 0 on the sas module: no engine, and stage 2's one chute alone predicts over 15 m/s at Duna, with both
# under it. It starts at the 80 km apoapsis of a 15 km periapsis orbit, so it needs no burn. The plan below stands in for a Mission's, so this
# Duna entry isn't the Last Entry: with #826's rule alone only stage 2 would open. reentry widens it to stage 0 too (#827), logs why in a
# chutes_widened block note, and lands. The Mission window's event for a craft nothing can land is for the other row (docs/in-game/entry-shield.md).
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_pe = 15000
orbit_inclination = 0
# Real seconds: half an orbit of warp, the entry, then a chute descent.
timeout_s = 3000
plan = Land on Duna | 0 | Down on the chutes, with no engine.
plan = Ascend from Duna | 1300 | Burns still planned after this entry.
plan = Return to Kerbin | 600 | The Last Entry.
check = success == true
check = landed_or_splashed == true
check = touchdown_speed < 15
# Both groups opened: stage 2's chute and the stage-0 chute.
check = chutes_used_count == 2
check = chutes_kept_count == 0
