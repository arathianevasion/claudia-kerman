# site_hop block test (debug_tools): a Site Hop between two Mun sites (#1310). The runner loads scenario.sfs, spawns
# reference.craft (the land test's lander, about 4 km/s of delta-v) into a 30 km equatorial Mun orbit, and runs test.ks
# bundled with the Core Library. test.ks lands it from a suborbital arc (as land_suborbital), asks for a hop 0.5 km away
# (refused before liftoff), then hops to a site 20 km east of where it came down.
block = site_hop
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds: the first landing as land_suborbital (up to 1200), then the hop's burn, a two-minute arc and its descent.
timeout_s = 1800
check = success == true
check = situation == LANDED
# The first landing, which the hop starts from.
check = test_first_landed == true
# Too near: refused before liftoff, the craft still LANDED where it was.
check = test_near_refused == true
check = test_near_stayed == true
# The hop: 20 km of ground; the least-speed arc is about 176 m/s from rest, plus the rise and steering losses.
check = hop_km > 19
check = hop_km < 21
check = hop_burn_dv > 150
check = hop_burn_dv < 300
# Down within land's usual aim of the hop's site, gently.
check = test_hop_m < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = lean >= 0
check = lean < 15
