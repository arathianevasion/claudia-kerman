# exec_node_rcs_turn block test (debug_tools, #692). The runner loads scenario.sfs, spawns reference.craft (dock's craft:
# a Small Inline Reaction Wheel, four RV-105 RCS blocks and an FL-R10 of 20 units of monopropellant) into a circular
# 100 km Kerbin orbit, and runs test.ks, which has exec_node fly a 10 m/s node 120 s ahead pointing straight behind the
# craft. The turn to it is a big turn, flown in bursts: two short RCS bursts with a coast between them, then the wheel.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 600
check = success == true
check = test_turn_deg > 150
# The turn ended before the Burn Start and the craft was aligned.
check = late_start_s == 0
check = not_aligned == 0
# #692: two bursts spend a small share of the 20 units (the old continuous firing spent several units on a turn like this).
# A first bound, about six times the plan's 2 x I x omega / r for this craft: tighten it once a run has measured it.
check = test_monoprop_used < 1
# #754: the burst turn now plans half the wheels' time (it used to fill 80% of the 120 s left, up to 96 s), so the coast is faster
# and the turn much shorter; the monoprop bound stays (bursts scale with the coast rate, still far under 1).
