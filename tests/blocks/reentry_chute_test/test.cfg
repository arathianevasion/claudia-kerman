# reentry chute test block test (#1029, debug_tools): reentry_hop's fall, with a parachute test planned on the way
# down through 0–5 km (part_test stands in for a Mission's chosen PartTest Contract). ADR 0019: reentry opens the
# Mk16 at its own timing; only then does Core's PARTTEST signal its Run Test, and no stage is fired for it. KSP.log has
# the "PARTTEST reentry: ran the test of parachuteSingle (run)" line; the landing is as before.
block = reentry
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_pe = -200000
orbit_inclination = 0
timeout_s = 900
part_test = descent | parachuteSingle | FLYING | 0 | 5000
check = success == true
check = touchdown_speed < 12
check = landed_or_splashed == true
