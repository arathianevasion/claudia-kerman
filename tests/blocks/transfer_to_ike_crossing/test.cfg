# transfer_to block test from flight 908b's Duna orbit (#867, debug_tools). The runner loads scenario.sfs (UT 100, Kerbin's
# window about 150 Kerbin days away), spawns reference.craft at the apoapsis of a 100 x 2,144 km Duna orbit, runs test.ks bundled
# with the Core Library, and judges its Script Result below. Ike's sphere of influence reaches down to 2,054 km from Duna's centre,
# 1,734 km up, so the orbit crosses it. transfer_to must burn nothing: either its watched wait for the ejection drops the warp before
# Ike ("would meet Ike at UT ..."), or it refuses an ejection that meets Ike and names the orbit ("the orbit you're in crosses
# Ike's SOI: lower its apoapsis below 1,734 km ..."). The plan-time Blocker and the between-runs watch need a Mission:
# docs/in-game/moon-crossing.md.
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
# Without them a refusal here may be an EC abort that doesn't name Ike.
block = transfer_to
craft = reference.craft
orbit_body = Duna
orbit_altitude = 2144000
orbit_pe = 100000
orbit_inclination = 0
# Real seconds, warp included: up to about 30 loops of 19,800 s (Core finds Ike within 13 in 908b) at KSP's top warp.
timeout_s = 1200
check = success == false
# The reason names Ike (test.ks reads it): the watch's drop, or the refusal with the orbit's fix.
check = names_ike == true
check = burned_nothing == true
check = body == Duna
