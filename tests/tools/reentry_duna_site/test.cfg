# A Duna landing at a site from find_landing_site (tests/tools, debug_tools; #828): here and not in tests/blocks because only a tool
# scenario may call the test-only Planning Tool bridge. See blocks/deorbit_kerbin/test.cfg for how it runs. deorbit_duna's craft from an
# 80 km circular equatorial orbit. The script asks find_landing_site for a daylight site near the equator, gives the first to deorbit as
# its target with the tank and engine kept, and reentry brings it down. The miss from the site is reported and recorded in
# docs/in-game/air-landing-site.md: no accuracy is promised yet, and until #814 predicts the craft after the drop it may read high.
# Craft (#920): four OX-STAT static solar panels (solarPanels5, 0.35 EC/s each at best in full sun, an estimate) on the kOS part, above the
# decoupler: the batteries alone drain to min_ec_pct on a wait of more than about 54,000 s of game time (estimated). Static panels
# have no deploy or retract, so Ship Systems never retracts them. All figures are rough estimates.
# Craft (#920): the three R8 winglets are off the tank. reentry holds retrograde with the engine and its fins in front, and the tail
# winglets fought that hold (return_target tumbled at 34 km, 132 deg/s). The craft is spawned in orbit, so it needs no fins.
block = reentry
craft = reference.craft
orbit_body = Duna
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Duna (about 18 h) on rails to the burn, then the entry and the fall.
timeout_s = 3000
check = sites > 0
check = burn_ut > 0
check = landed_or_splashed == true
# The spec: the tool's sun at the site is Daylight, and so is the sun the craft came down under.
check = site_sun_deg > 20
check = sun_elevation_deg > 20
# Reported for the doc, not judged: a miss it never measured stays at 9999.
check = miss_km < 9999
