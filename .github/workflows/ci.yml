# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI has no KSP, so it builds and tests the Unity-free core; then, with kOS.Safe taken from the
# public kOS release, it tests the Script Check (ADR 0003) and runs it over every shipped script.
# The adapter and kOS addon need a local KSP install and are built on a developer machine
# (see README, Building).
name: CI

on:
  # Branches get CI through their pull request; a push to main runs after merge.
  # (Before, a branch with a PR ran twice per commit: once for push, once for the PR.)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels its older run. Every push to main gets its
# own group, so no main run is cancelled or dropped while queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # kOS release whose kOS.Safe.dll the Script Check compiles with; keep in step with the supported kOS.
  KOS_RELEASE_TAG: 1.6.0.1

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Kerboscript line limit (ADR 0014)
        run: bash tools/gates/kerboscript-loc.sh

      - name: Build and test the core
        run: dotnet test tests/ClaudiaKerman.Core.Tests -c Release --filter "Category!=Timing"

      # The wall-clock tests (#623) fail on slow runners; run them for the record, on main only, without failing the job.
      - name: Core timing tests (informational)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: dotnet test tests/ClaudiaKerman.Core.Tests -c Release --no-build --filter "Category=Timing"

      - name: Fetch kOS.Safe from the kOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kos"
          gh release download "$KOS_RELEASE_TAG" --repo KSP-KOS/KOS --pattern '*.zip' --dir "$RUNNER_TEMP/kos"
          for zip in "$RUNNER_TEMP"/kos/*.zip; do
            unzip -q -o "$zip" -d "$RUNNER_TEMP/kos/unpacked"
          done
          safe=$(find "$RUNNER_TEMP/kos/unpacked" -name kOS.Safe.dll | head -n 1)
          if [ -z "$safe" ]; then echo "kOS.Safe.dll not found in the $KOS_RELEASE_TAG release"; exit 1; fi
          echo "KOS_PLUGINS_DIR=$(dirname "$safe")" >> "$GITHUB_ENV"

      - name: Test the Script Check with kOS.Safe
        run: dotnet test tests/ClaudiaKerman.ScriptCheck.Tests -c Release -p:KOSPluginsDir="$KOS_PLUGINS_DIR"

      - name: Build the Script Check command line
        run: dotnet build tools/ClaudiaKerman.KsCompile -c Release -p:KOSPluginsDir="$KOS_PLUGINS_DIR"

      # Every shipped script under kerboscript/ (the Core Library in kerboscript/library, and the
      # debug scripts) and the block test scripts: a compile error or
      # a forbidden call fails CI.
      - name: Script Check the shipped kerboscript and the block test scripts
        run: dotnet run --project tools/ClaudiaKerman.KsCompile -c Release --no-build -- kerboscript tests/blocks

      - name: Test the Core Library on kOS.Safe
        run: dotnet test tests/ClaudiaKerman.Kerboscript.Tests -c Release -p:KOSPluginsDir="$KOS_PLUGINS_DIR"

      - name: Check that a syntax error and a forbidden call fail the Script Check
        run: |
          for fixture in syntax-error forbidden-call; do
            if dotnet run --project tools/ClaudiaKerman.KsCompile -c Release --no-build -- "tools/ClaudiaKerman.KsCompile/fixtures/$fixture.ks"; then
              echo "The Script Check passed $fixture.ks"
              exit 1
            fi
          done
