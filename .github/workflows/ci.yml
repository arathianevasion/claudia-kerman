# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI runs the merge gate, tools/gates/gates.sh, so CI and a local run check the same things (#1004).
# On the watsonsoft pool (the home PC) CI builds against KSP: the runner environment mounts C:\KSP read-only at /mnt/ksp,
# so the gate runs in full (GATES_NO_KSP=0). On the GitHub-hosted fallback there is no KSP: kOS.Safe comes from the public
# kOS release, and GATES_NO_KSP=1 skips building the adapter and kOS addon, which need a local KSP install (see README, Building). The Kerboscript tests
# run as one test process per core, as they do locally.
#
# The gate runs as three parallel jobs (#1049), because every step at once on one 4-vCPU runner took 10-14 min. Each job
# builds, then runs its share through GATES_ONLY (tools/gates/gates.sh prints SKIP for the rest), so every gate line comes
# from exactly one job:
#   core:         Core tests
#   kerboscript:  Kerboscript tests, library line limit
#   scriptcheck:  Script Check tests, Quarantine tests and their tracking-issue check (#1067), tests/blocks and tests/tools through KsCompile, undefined calls, fixtures
# A push to main whose tree already passed on its PR skips the gate and names that run (#1050); the `check` job decides and
# the `record` job saves each green run's pass. PR runs never skip.
# The gate jobs cache ~/.nuget/packages with actions/cache, keyed on the csproj and Directory.Build files (#1052).
# Jobs: pick (watsonsoft/ci-shared's runner picker: the pool, else ubuntu-latest; fork PRs never get the pool), check (skip
# decision), gate (the matrix above), record (saves the pass when every gate job is green).
# fail-fast is off so one failing job doesn't hide the others' results; any failing job fails the run.
name: CI

on:
  # Branches get CI through their pull request; a push to main runs after merge.
  # (Before, a branch with a PR ran twice per commit: once for push, once for the PR.)
  # A change that only touches docs/ or root markdown files starts no run (#1075): no gate step reads them.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      skip_if_passed:
        description: Skip the gate when this tree already passed (as a push to main does)
        type: boolean
        default: false
      force:
        description: Where to run (auto follows the picker; pool builds against KSP, fallback doesn't)
        type: choice
        options: [auto, pool, fallback]
        default: auto

# A newer push to the same PR cancels its older run. Every push to main gets its
# own group, so no main run is cancelled or dropped while queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # kOS release whose kOS.Safe.dll the Script Check compiles with; keep in step with the supported kOS.
  KOS_RELEASE_TAG: 1.6.0.1

jobs:
  # Picks where the gate runs (see the header).
  pick:
    uses: watsonsoft/ci-shared/.github/workflows/runner-picker.yml@v1
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    with:
      force: ${{ inputs.force != 'auto' && inputs.force || '' }}

  # Skip a tree that already passed (#1050). A pass is recorded as an artifact named gates-pass-<tree>-<settings hash>, saved
  # by the `record` job after all three gate jobs are green. Only a push to main (or a dispatch with skip_if_passed) looks it
  # up, so a PR always runs and shows its own result. A merge that makes a new tree, or a changed setting, finds nothing and
  # runs the full gate. (Not actions/cache: a cache saved on a PR ref can't be read from main.)
  check:
    name: already passed?
    needs: pick
    runs-on: ubuntu-latest
    env:
      # KSP only on the pool (see the header). Both settings are in the pass record's key (#1050).
      GATES_NO_KSP: ${{ needs.pick.outputs.pool == 'true' && '0' || '1' }}
    permissions:
      contents: read
      actions: read
    outputs:
      key: ${{ steps.look.outputs.key }}
      skip: ${{ steps.look.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          MAY_SKIP: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.skip_if_passed) }}
        run: |
          key=$(bash tools/gates/ci-pass-record.sh key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "$MAY_SKIP" = true ]; then
            run=$(bash tools/gates/ci-pass-record.sh lookup "$key")
            if [ -n "$run" ]; then
              skip=true
              echo "tree $(git rev-parse 'HEAD^{tree}') already passed in run $run (https://github.com/$GITHUB_REPOSITORY/actions/runs/$run); not building. The informational timing tests are skipped with it."
            else
              echo "no earlier pass for $key; running the full gate"
            fi
          else
            echo "$GITHUB_EVENT_NAME on $GITHUB_REF never skips; running the full gate (key $key)"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  gate:
    name: gate (${{ matrix.name }})
    needs: [pick, check]
    if: needs.check.outputs.skip != 'true'
    # The pool, with KSP, else GitHub-hosted without it (pick). This repo is public: a pull request from a fork never gets
    # the pool.
    runs-on: ${{ fromJSON(needs.pick.outputs.runner) }}
    env:
      GATES_NO_KSP: ${{ needs.pick.outputs.pool == 'true' && '0' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            only: core
          - name: kerboscript
            only: kerboscript,kerboscript-loc
          - name: scriptcheck
            only: scriptcheck,quarantine,blocks,tools,undefined-calls,fixtures
    steps:
      - uses: actions/checkout@v4

      # Into the runner's tool cache: the default, /usr/share/dotnet, isn't writable on the home-wsl PC runner.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.x

      # NuGet packages (#1052), keyed on every file that names a package version. No lock files: they would add a
      # packages.lock.json per project and a --locked-mode restore to keep in step with every version bump.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # On the pool: KSP and its kOS install, read-only at /mnt/ksp. MSBuild reads KSPRoot and KSPManagedDir from the
      # environment, as the PC's own builds do (KSP for Windows keeps its assemblies in KSP_x64_Data/Managed).
      - name: Use KSP from the runner environment
        if: needs.pick.outputs.pool == 'true'
        run: |
          for d in /mnt/ksp/KSP_x64_Data/Managed /mnt/ksp/GameData/kOS/Plugins; do
            [ -d "$d" ] || { echo "::error::$d not found: the runner environment should mount KSP at /mnt/ksp"; exit 1; }
          done
          { echo "KSPRoot=/mnt/ksp"; echo "KSPManagedDir=/mnt/ksp/KSP_x64_Data/Managed"; echo "KOS_PLUGINS_DIR=/mnt/ksp/GameData/kOS/Plugins"; } >> "$GITHUB_ENV"

      - name: Fetch kOS.Safe from the kOS release
        if: needs.pick.outputs.pool != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kos"
          gh release download "$KOS_RELEASE_TAG" --repo KSP-KOS/KOS --pattern '*.zip' --dir "$RUNNER_TEMP/kos"
          for zip in "$RUNNER_TEMP"/kos/*.zip; do
            unzip -q -o "$zip" -d "$RUNNER_TEMP/kos/unpacked"
          done
          safe=$(find "$RUNNER_TEMP/kos/unpacked" -name kOS.Safe.dll | head -n 1)
          if [ -z "$safe" ]; then echo "kOS.Safe.dll not found in the $KOS_RELEASE_TAG release"; exit 1; fi
          echo "KOS_PLUGINS_DIR=$(dirname "$safe")" >> "$GITHUB_ENV"

      # The build, then this job's steps only (see the header). A GATES_ONLY run never writes the pass record.
      - name: Merge gate (tools/gates/gates.sh, ${{ matrix.name }})
        env:
          GH_TOKEN: ${{ github.token }}   # the Quarantine step reads each tracking issue's state
          GATES_ONLY: ${{ matrix.only }}
        run: bash tools/gates/gates.sh

      # The wall-clock tests (#623) fail on slow runners; run them for the record, on main only, in the core job, without
      # failing it.
      - name: Core timing tests (informational)
        if: github.ref == 'refs/heads/main' && matrix.name == 'core'
        continue-on-error: true
        run: dotnet test tests/ClaudiaKerman.Core.Tests --no-build --filter "Category=Timing"

  # Record the pass once every gate job is green. A second upload of a key that already exists is harmless: lookup takes the
  # newest.
  record:
    name: record pass
    needs: [check, gate]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "$GITHUB_RUN_ID" > pass.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check.outputs.key }}
          path: pass.txt
          retention-days: 30
