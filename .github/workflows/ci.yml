# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI runs the merge gate, tools/gates/gates.sh, so CI and a local run check the same things (#1004).
# CI has no KSP: kOS.Safe comes from the public kOS release, and GATES_NO_KSP=1 skips building the
# adapter and kOS addon, which need a local KSP install (see README, Building). The Kerboscript tests
# run as one test process per core, as they do locally.
name: CI

on:
  # Branches get CI through their pull request; a push to main runs after merge.
  # (Before, a branch with a PR ran twice per commit: once for push, once for the PR.)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels its older run. Every push to main gets its
# own group, so no main run is cancelled or dropped while queued.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # kOS release whose kOS.Safe.dll the Script Check compiles with; keep in step with the supported kOS.
  KOS_RELEASE_TAG: 1.6.0.1

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch kOS.Safe from the kOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kos"
          gh release download "$KOS_RELEASE_TAG" --repo KSP-KOS/KOS --pattern '*.zip' --dir "$RUNNER_TEMP/kos"
          for zip in "$RUNNER_TEMP"/kos/*.zip; do
            unzip -q -o "$zip" -d "$RUNNER_TEMP/kos/unpacked"
          done
          safe=$(find "$RUNNER_TEMP/kos/unpacked" -name kOS.Safe.dll | head -n 1)
          if [ -z "$safe" ]; then echo "kOS.Safe.dll not found in the $KOS_RELEASE_TAG release"; exit 1; fi
          echo "KOS_PLUGINS_DIR=$(dirname "$safe")" >> "$GITHUB_ENV"

      # The build, Core, Kerboscript (one process per core) and Script Check tests, KsCompile over the shipped
      # kerboscript, tests/blocks and tests/tools, the undefined-call check and every fixture, and the library line limit.
      - name: Merge gate (tools/gates/gates.sh)
        env:
          GATES_NO_KSP: 1
        run: bash tools/gates/gates.sh

      # The wall-clock tests (#623) fail on slow runners; run them for the record, on main only, without failing the job.
      - name: Core timing tests (informational)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: dotnet test tests/ClaudiaKerman.Core.Tests --no-build --filter "Category=Timing"
